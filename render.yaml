services:
  - type: web
    name: studlyf-hr-platform
    env: node
    rootDir: backend-node
    buildCommand: npm install && npx prisma generate
    startCommand: npx prisma db push --accept-data-loss && node prisma/seed_safe.js && node src/index.js
    envVars:
      - key: NODE_VERSION
        value: 20.0.0
      - key: ENVIRONMENT
        value: production
      - key: FRONTEND_URL
        value: https://studlyf-hr-platform.vercel.app
      - key: GITHUB_REDIRECT_URL
        value: https://studlyf-hr-platform.onrender.com/api/auth/github/callback
      - key: GOOGLE_REDIRECT_URI
        value: https://studlyf-hr-platform.onrender.com/api/auth/google/callback
